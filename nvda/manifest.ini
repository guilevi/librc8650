name = rc8650
summary = "RC8650 / RC8660 (emulated)"
description = """Speech synthesizer driver for an emulated RC Systems RC8650 or RC8660: the chip's own firmware running on an emulated Renesas M16C, producing the PCM its D/A converter would have. Choose between firmware images in NVDA's settings; the voices and settings follow the chip - eight voices on the RC8650, eleven on the RC8660. The firmware is proprietary to RC Systems and is not included - supply your own."""
author = "librc8650"
url = https://example.invalid/librc8650
version = 0.3.0
docFileName = readme.html
minimumNVDAVersion = 2023.1.0
lastTestedNVDAVersion = 2026.1.0
